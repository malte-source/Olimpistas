<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olimpistas — Sé parte de Olimpia</title>
  <link rel="icon" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="/"><img src="/assets/logo.svg" alt="" /> Olimpistas</a>
    <div class="nav-right">
      <button class="lang" id="langBtn">ES ▾</button>
      <button class="btn btn-ghost" id="accederBtn">Acceder</button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-bg"><img src="/assets/hero.svg" alt="" /></div>
    <div class="hero-inner wrap">
      <span class="pill">El Rey de Copas · El Decano</span>
      <h1 id="heroTitle">Sé parte de Olimpia</h1>
      <p class="sub" id="heroSub">Cargando…</p>

      <div class="tiers" id="tiers"><!-- tiers van acá --></div>

      <a class="ver-todas" href="#ventajas">Ver todas las ventajas</a>
    </div>
  </section>

  <!-- Modal auth -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3 id="modalTitle">Acceder</h3>
      <p class="muted" id="modalSub">Ingresá para gestionar tu membresía.</p>
      <div class="field" id="nombreField" style="display:none">
        <label>Nombre</label>
        <input id="nombre" type="text" placeholder="Tu nombre" autocomplete="name" />
      </div>
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="tu@email.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <p class="error" id="modalError"></p>
      <button class="btn btn-block" id="submitBtn">Ingresar</button>
      <p class="switch" id="switchMode">¿No tenés cuenta? <a id="switchLink">Registrate</a></p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/common.js"></script>
  <script src="/js/landing.js"></script>
</body>
</html>
