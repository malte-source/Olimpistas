<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nueva contraseña — Olimpistas.com</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <style>
    :root { --negro:#0b0b0f; --panel:#14141b; --linea:#2a2a33; --oro:#c9a227; --oro2:#f0d873; --blanco:#fff; --gris:#8a909a; --verde:#2ec27e; --rojo:#e0556b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--negro); color:var(--blanco); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
    .box { max-width:380px; margin:12vh auto 0; padding:0 20px; text-align:center; }
    img { height:44px; margin-bottom:22px; }
    h1 { font-size:22px; margin:0 0 6px; }
    p.sub { color:var(--gris); font-size:14px; margin:0 0 22px; }
    label { display:block; text-align:left; font-size:13px; color:var(--gris); margin:12px 0 5px; }
    input { width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--linea); background:#0f0f15; color:#fff; font-size:16px; }
    button { width:100%; margin-top:18px; background:linear-gradient(120deg,var(--oro2),var(--oro)); color:#1a1500; border:none; font-weight:800; padding:14px; border-radius:11px; font-size:16px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .msg { min-height:20px; font-size:14px; margin-top:14px; }
    .err { color:var(--rojo); } .ok { color:var(--verde); }
    a { color:var(--oro2); }
  </style>
</head>
<body>
  <div class="box">
    <img src="/assets/logo-horizontal.svg?v=88" alt="Olimpistas" />
    <div id="form">
      <h1>Crear nueva contraseña</h1>
      <p class="sub">Elegí una contraseña nueva para tu cuenta.</p>
      <label>Nueva contraseña</label>
      <input id="p1" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
      <label>Repetir contraseña</label>
      <input id="p2" type="password" placeholder="••••••••" autocomplete="new-password" />
      <button id="btn">Guardar contraseña</button>
      <p class="msg err" id="msg"></p>
    </div>
    <div id="done" hidden>
      <h1>✅ ¡Listo!</h1>
      <p class="sub">Tu contraseña se actualizó. Ya podés ingresar.</p>
      <a href="/miembro"><button>Ir a ingresar</button></a>
    </div>
  </div>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    var token = new URLSearchParams(location.search).get("token") || "";
    if (!token) { $("msg").textContent = "Enlace inválido o incompleto. Pedí uno nuevo desde 'Ingresar'."; $("btn").disabled = true; }
    $("btn").addEventListener("click", async function () {
      var p1 = $("p1").value, p2 = $("p2").value;
      $("msg").textContent = "";
      if (p1.length < 8) { $("msg").textContent = "La contraseña debe tener al menos 8 caracteres."; return; }
      if (p1 !== p2) { $("msg").textContent = "Las contraseñas no coinciden."; return; }
      $("btn").disabled = true; $("btn").textContent = "Guardando…";
      try {
        var res = await fetch("/api/auth/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token, password: p1 }) });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error((data && data.error) || "No se pudo actualizar");
        $("form").hidden = true; $("done").hidden = false;
      } catch (e) { $("msg").textContent = e.message; $("btn").disabled = false; $("btn").textContent = "Guardar contraseña"; }
    });
    $("p2").addEventListener("keydown", function (e) { if (e.key === "Enter") $("btn").click(); });
  </script>
</body>
</html>
