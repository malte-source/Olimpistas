<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nueva contraseña — Olimpistas.com</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <script src="/js/tema.js"></script>
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/styles.css?v=96" />
  <style>
    /* Nueva contraseña · sobre styles.css (roles) · prefijo .rst- */
    body { background: var(--surface-grouped); color: var(--text-primary); min-height: 100vh; }
    .rst-head { background: #0a0a0a; padding-top: env(safe-area-inset-top); }
    .rst-head-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 20px; }
    .rst-head img.rst-logo { height: 30px; width: auto; display: block; }
    .rst-head img.rst-escudo { height: 48px; width: auto; display: block; }
    .rst-fr { height: 6px; background: repeating-linear-gradient(90deg, #fff 0 18px, #0a0a0a 18px 36px); }
    .rst-box { max-width: 420px; margin: 6vh auto 0; padding: 0 16px 40px; }
    .rst-card { background: var(--surface-card); border-radius: var(--r-22); padding: 22px 20px; }
    .rst-card h1 { margin: 0 0 6px; font: 600 var(--t-22)/1.2 var(--display); letter-spacing: -.02em; }
    .rst-sub { color: var(--text-secondary); font-size: var(--t-13); line-height: 1.45; margin: 0 0 8px; }
    .rst-lbl { display: block; font-size: var(--t-13); font-weight: 600; color: var(--text-secondary); margin: 14px 0 6px; }
    .rst-card input { width: 100%; font: inherit; font-size: 16px; padding: 13px 14px; border-radius: var(--r-14); background: var(--surface-input); color: var(--text-primary); border: 1px solid var(--border-default); }
    .rst-card input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
    .rst-card .btn { margin-top: 18px; width: 100%; padding: 14px 18px; text-decoration: none; display: block; text-align: center; box-sizing: border-box; }
    .rst-card .btn:hover { transform: none; }
    .rst-msg { min-height: 20px; font-size: var(--t-13); margin: 12px 0 0; color: var(--text-error); }
    .rst-ok[hidden] { display: none; }
    .rst-ok { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
    .rst-ok .ic { width: 52px; height: 52px; color: var(--text-success); margin-bottom: 8px; }
  </style>
</head>
<body>
  <header class="rst-head">
    <div class="rst-head-in">
      <img class="rst-logo" src="/assets/logo-horizontal.svg?v=88" alt="Olimpistas" />
      <img class="rst-escudo" src="/assets/escudo-olimpia-blanco.png" alt="Club Olimpia" />
    </div>
    <div class="rst-fr" aria-hidden="true"></div>
  </header>
  <main class="rst-box">
    <div class="rst-card" id="form">
      <h1>Crear nueva contraseña</h1>
      <p class="rst-sub">Elegí una contraseña nueva para tu cuenta.</p>
      <label class="rst-lbl" for="p1">Nueva contraseña</label>
      <input id="p1" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
      <label class="rst-lbl" for="p2">Repetir contraseña</label>
      <input id="p2" type="password" placeholder="••••••••" autocomplete="new-password" />
      <button class="btn" id="btn">Guardar contraseña</button>
      <p class="rst-msg" id="msg" role="alert"></p>
    </div>
    <div class="rst-card rst-ok" id="done" hidden>
      <svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-check-circulo-f"/></svg>
      <h1>¡Listo!</h1>
      <p class="rst-sub">Tu contraseña se actualizó. Ya podés ingresar.</p>
      <a class="btn" href="/miembro">Ir a ingresar</a>
    </div>
  </main>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    var token = new URLSearchParams(location.search).get("token") || "";
    if (!token) { $("msg").textContent = "Enlace inválido o incompleto. Pedí uno nuevo desde 'Ingresar'."; $("btn").disabled = true; }
    $("btn").addEventListener("click", async function () {
      var p1 = $("p1").value, p2 = $("p2").value;
      $("msg").textContent = "";
      if (p1.length < 8) { $("msg").textContent = "La contraseña debe tener al menos 8 caracteres."; return; }
      if (p1 !== p2) { $("msg").textContent = "Las contraseñas no coinciden."; return; }
      $("btn").disabled = true; $("btn").textContent = "Guardando…";
      try {
        var res = await fetch("/api/auth/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token, password: p1 }) });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error((data && data.error) || "No se pudo actualizar");
        $("form").hidden = true; $("done").hidden = false;
      } catch (e) { $("msg").textContent = e.message; $("btn").disabled = false; $("btn").textContent = "Guardar contraseña"; }
    });
    $("p2").addEventListener("keydown", function (e) { if (e.key === "Enter") $("btn").click(); });
  </script>
</body>
</html>
