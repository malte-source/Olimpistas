<!DOCTYPE html>
<html lang="es">
<head>
  <script>if (location.hostname === "olimpistas.com") location.replace("https://www.olimpistas.com" + location.pathname + location.search + location.hash);</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mi cuenta — Olimpistas</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- El encabezado es negro en los dos temas, así que la barra de estado también. -->
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: light)" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Olimpistas" />
  <script src="/js/tema.js"></script>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/saira-600.woff2" crossorigin />
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/styles.css?v=95" />
  <style>html { background: var(--surface-grouped); }</style>
</head>
<body class="app">
  <!-- Encabezado negro: título de la vista (grande, se achica al hacer scroll), escudo blanco, avatar → Ajustes y franjas. -->
  <header class="mhead" id="mHead" style="--c:0">
    <div class="mhead-body">
      <div class="mhead-tx">
        <a class="mhead-back" id="mBack" href="/miembro" hidden><svg class="ic" width="18" height="18"><use href="/assets/icons.svg#i-chevron-izquierda"/></svg><span data-i18n="tab_inicio">Inicio</span></a>
        <h1 id="mTitle">&nbsp;</h1><p id="mSub"></p>
      </div>
      <img class="mhead-escudo" src="/assets/escudo-olimpia-blanco.png" alt="Club Olimpia" width="58" height="58" />
      <button type="button" class="mhead-av" id="mAv" aria-label="Ajustes" aria-haspopup="dialog"></button>
    </div>
    <div class="mhead-fr" aria-hidden="true"></div>
  </header>
  <div class="mhead-sp" aria-hidden="true"></div>

  <!-- Navegación: barra inferior fija en el móvil; barra lateral de 250 px en escritorio. -->
  <aside class="side" id="side">
    <a class="side-brand" href="/"><img src="/assets/logo-horizontal.svg?v=88" alt="Olimpistas.com" height="30" /></a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones">
      <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
      <button class="tab active" role="tab" aria-selected="true" data-tab="inicio"><svg class="ic tab-ic"><use href="/assets/icons.svg#i-inicio-f"/></svg><span data-i18n="tab_inicio">Inicio</span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="partidos"><svg class="ic tab-ic"><use href="/assets/icons.svg#i-partidos"/></svg><span data-i18n="tab_partidos">Partidos</span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="carnet"><svg class="ic tab-ic"><use href="/assets/icons.svg#i-carnet"/></svg><span data-i18n="tab_carnet">Mi carnet</span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="beneficios"><svg class="ic tab-ic"><use href="/assets/icons.svg#i-beneficios"/></svg><span data-i18n="tab_beneficios">Beneficios</span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="puntos"><svg class="ic tab-ic"><use href="/assets/icons.svg#i-puntos"/></svg><span data-i18n="tab_puntos">Puntos</span></button>
    </nav>
    <div class="side-tema ctl-seg" id="sideTema" role="radiogroup" aria-label="Apariencia"></div>
    <button type="button" class="side-user" id="sideUser" aria-haspopup="dialog"></button>
  </aside>

  <div class="wrap">
    <div id="view" role="tabpanel"><p class="muted" data-i18n="m_cargando">Cargando…</p></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/js/i18n.js?v=95"></script>
  <script src="/js/common.js?v=95"></script>
  <script src="/assets/vendor/qrcode.js" defer></script>
  <script src="/js/socio.js?v=95"></script>
  <script src="/js/atencion.js?v=95"></script>
</body>
</html>
