<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mi cuenta — Olimpistas</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b0b0f" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Olimpistas" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="/css/styles.css?v=7" />
  <style> body { background: var(--negro); } .wrap { padding-top: 0; } </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="/"><img class="brand-h" src="/assets/logo-horizontal.svg" alt="Olimpistas" /></a>
      <div class="nav-right">
        <span id="hola" class="muted"></span>
        <button class="btn btn-ghost" id="logoutBtn">Salir</button>
      </div>
    </div>

    <!-- Barra de progreso de perfil (persistente) -->
    <div id="progreso"></div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="perfil">Mi perfil</button>
      <button class="tab" data-tab="membresia">Mi membresía</button>
      <button class="tab" data-tab="contenido">Olimpia Media+</button>
      <button class="tab" data-tab="sorteos">Sorteos</button>
      <button class="tab" data-tab="preventas">Preventas</button>
      <button class="tab" data-tab="carnet">Mi carnet</button>
    </div>

    <div id="view"><p class="muted">Cargando…</p></div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/common.js?v=7"></script>
  <script src="/assets/vendor/maplibre-gl.js" defer></script>
  <script src="/assets/vendor/qrcode.js" defer></script>
  <script src="/js/globe.js?v=7" defer></script>
  <script src="/js/socio.js?v=7"></script>
</body>
