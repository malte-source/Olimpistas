name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres real para los tests de migraciones, de pg-store (atomicidad del cobro) y de
    # contrato memoria <-> Postgres. Sin esto esos tests se saltean.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
          # Falla el job si los tests con base de datos no corrieron (evita un verde engañoso).
          EXIGIR_TEST_DB: "1"
      # Falla solo por vulnerabilidades de PRODUCCIÓN de severidad alta/crítica.
      # (xlsx es devDependency — solo lo usan scripts de setup, no el runtime.)
      - name: Security audit (producción)
        run: npm audit --omit=dev --audit-level=high
