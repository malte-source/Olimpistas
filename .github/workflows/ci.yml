name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run tests
        run: npm test
      # Falla solo por vulnerabilidades de PRODUCCIÓN de severidad alta/crítica.
      # (xlsx es devDependency — solo lo usan scripts de setup, no el runtime.)
      - name: Security audit (producción)
        run: npm audit --omit=dev --audit-level=high
